<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="144" viewBox="0 0 1200 144" role="img" aria-labelledby="title desc">
<title id="title">RTL, FPGA, and Verification</title>
<desc id="desc">A compact decorative hardware header with gently moving cyan pulses. Design intent. Tested behaviour.</desc>
<defs><linearGradient id="background"><stop stop-color="#101c2b"/><stop offset="1" stop-color="#0d1117"/></linearGradient></defs>
<style>
.track{fill:none;stroke:#284757;stroke-width:2}.pulse{fill:none;stroke:#56d5e7;stroke-width:2;stroke-dasharray:18 450;animation:flow 9s linear infinite}.second{animation-delay:-4s;stroke:#61c6b1}.pin{stroke:#487386;stroke-width:2}text{font-family:Arial,Helvetica,sans-serif}@keyframes flow{to{stroke-dashoffset:-468}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}
</style>
